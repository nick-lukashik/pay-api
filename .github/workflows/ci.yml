name: ci

# The org reusable workflows (nick-lukashik/.github, docs/ci.md): pnpm verify
# with every service container and the image, then the gitops deploy PR.

on:
    pull_request:
    push:
        branches: [master]

permissions: {}

jobs:
    # Job id "ci" gives the required check "ci / verify".
    ci:
        uses: nick-lukashik/.github/.github/workflows/build.yml@v1.1.0 # the first with github-packages
        permissions:
            contents: read
            packages: write
        with:
            kind: api
            # Exported as TEST_DATABASE_URL, TEST_REDIS_URL, TEST_RABBITMQ_URL; the
            # integration tests use them instead of Testcontainers (test/global-setup.ts).
            services: postgres,redis,rabbitmq
            # @nick-lukashik/auth and /contracts from GitHub Packages.
            github-packages: true
            # No image until the Lava merchant account: pay-api is not deployed before it
            # (without Lava it could only run the test provider, free coins for anyone).
            publish: false
